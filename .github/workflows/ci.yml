name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Code Quality Checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Type check
        run: npm run typecheck

      - name: Lint check
        run: npx eslint "src/**/*.ts" "prisma/seed.ts"

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
