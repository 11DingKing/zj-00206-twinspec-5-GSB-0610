<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwinSpec - 油电车型重量对比分析系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      padding: 30px 0;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-card .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 5px;
    }

    .stat-card .label {
      font-size: 0.9rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card.warning .value {
      color: #f59e0b;
    }

    .stat-card.danger .value {
      color: #ef4444;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      padding: 12px 24px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .tab-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .tab-btn.active {
      background: white;
      color: #667eea;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .section {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .class-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .class-card {
      background: linear-gradient(135deg, #f0f4ff 0%, #e8ecff 100%);
      border-radius: 12px;
      padding: 20px;
      border-left: 4px solid #667eea;
    }

    .class-card.suv {
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      border-left-color: #f59e0b;
    }

    .class-card.mpv {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border-left-color: #10b981;
    }

    .class-card h3 {
      font-size: 1.25rem;
      color: #1f2937;
      margin-bottom: 15px;
    }

    .class-stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .class-stat-row:last-child {
      border-bottom: none;
    }

    .class-stat-row .stat-label {
      color: #6b7280;
      font-size: 0.9rem;
    }

    .class-stat-row .stat-value {
      font-weight: 600;
      color: #1f2937;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead {
      background: #f9fafb;
    }

    th {
      padding: 14px 12px;
      text-align: left;
      font-weight: 600;
      color: #374151;
      border-bottom: 2px solid #e5e7eb;
      white-space: nowrap;
    }

    td {
      padding: 14px 12px;
      border-bottom: 1px solid #f3f4f6;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    .model-cell {
      font-weight: 600;
      color: #1f2937;
    }

    .brand-cell {
      color: #6b7280;
      font-size: 0.85rem;
    }

    .weight-cell {
      font-family: 'SF Mono', Monaco, monospace;
      font-weight: 500;
    }

    .diff-positive {
      color: #ef4444;
      font-weight: 600;
    }

    .diff-extreme {
      color: #dc2626;
      font-weight: 700;
      background: #fef2f2;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .badge-ice {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .badge-ev {
      background: #d1fae5;
      color: #047857;
    }

    .badge-sedan {
      background: #e0e7ff;
      color: #4338ca;
    }

    .badge-suv {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-mpv {
      background: #d1fae5;
      color: #065f46;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .rank-1 {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: white;
    }

    .rank-2 {
      background: linear-gradient(135deg, #9ca3af, #6b7280);
      color: white;
    }

    .rank-3 {
      background: linear-gradient(135deg, #cd7f32, #b45309);
      color: white;
    }

    .rank-other {
      background: #f3f4f6;
      color: #4b5563;
    }

    .battery-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .battery-bar {
      width: 60px;
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
    }

    .battery-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
    }

    .battery-fill.high {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
    }

    .correlation-high {
      color: #ef4444;
      font-weight: 600;
    }

    .correlation-medium {
      color: #f59e0b;
      font-weight: 500;
    }

    .correlation-low {
      color: #10b981;
      font-weight: 500;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .dimensions {
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .normalized-hint {
      display: inline-block;
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #6b7280;
      margin-left: 5px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .status-paired {
      background: #d1fae5;
      color: #047857;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-review {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-bar select {
      padding: 8px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      background: white;
      cursor: pointer;
    }

    .battery-analysis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .battery-card {
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .battery-card.large {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
    }

    .battery-card.medium {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    }

    .battery-card.small {
      background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
    }

    .battery-card h4 {
      margin-bottom: 10px;
      color: #374151;
    }

    .battery-card .count {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .battery-card .metric {
      font-size: 0.9rem;
      color: #4b5563;
      margin: 5px 0;
    }

    .battery-card .metric strong {
      color: #1f2937;
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 1.75rem;
      }

      .section {
        padding: 20px;
      }

      table {
        font-size: 0.8rem;
      }

      th, td {
        padding: 10px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ TwinSpec 油电重量对比分析系统</h1>
      <p>同款车型内燃机版本 vs 纯电版本重量差异深度分析</p>
    </header>

    <div id="stats-grid" class="stats-grid">
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="overview">📊 统计概览</button>
      <button class="tab-btn" data-tab="comparison">📋 成对对比表</button>
      <button class="tab-btn" data-tab="extreme">🔥 增重排行榜</button>
      <button class="tab-btn" data-tab="battery">🔋 电池相关性</button>
    </div>

    <div id="tab-overview" class="tab-content active">
      <div class="section">
        <h2 class="section-title">📊 按车型级别平均增重统计</h2>
        <div id="class-stats" class="class-stats">
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">🔋 电池容量与增重相关性分析</h2>
        <div id="battery-analysis" class="battery-analysis">
        </div>
      </div>
    </div>

    <div id="tab-comparison" class="tab-content">
      <div class="section">
        <h2 class="section-title">📋 油电车型成对对比表</h2>
        <div class="filter-bar">
          <label style="color: #374151; font-weight: 500;">车型级别:</label>
          <select id="class-filter">
            <option value="all">全部</option>
            <option value="SEDAN">轿车</option>
            <option value="SUV">SUV</option>
            <option value="MPV">MPV</option>
          </select>
          <label style="color: #374151; font-weight: 500;">排序:</label>
          <select id="sort-filter">
            <option value="weightGainPct">按增重比例</option>
            <option value="weightDiffKg">按增重绝对值</option>
            <option value="normalizedDiff">按归一化增重</option>
          </select>
        </div>
        <div class="table-container">
          <table id="comparison-table">
            <thead>
              <tr>
                <th>车型</th>
                <th>级别</th>
                <th>状态</th>
                <th>油版重量</th>
                <th>电版重量</th>
                <th>重量差</th>
                <th>增重比例</th>
                <th>归一化增重<span class="normalized-hint">kg/m³</span></th>
                <th>油版尺寸</th>
                <th>电版尺寸</th>
              </tr>
            </thead>
            <tbody id="comparison-tbody">
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="tab-extreme" class="tab-content">
      <div class="section">
        <h2 class="section-title">🔥 增重最夸张 TOP 10</h2>
        <div class="table-container">
          <table id="extreme-table">
            <thead>
              <tr>
                <th>排名</th>
                <th>车型</th>
                <th>级别</th>
                <th>油版重量</th>
                <th>电版重量</th>
                <th>重量差</th>
                <th>增重比例</th>
                <th>归一化增重</th>
                <th>电池容量</th>
                <th>电池相关性</th>
              </tr>
            </thead>
            <tbody id="extreme-tbody">
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="tab-battery" class="tab-content">
      <div class="section">
        <h2 class="section-title">🔋 电池容量分组分析</h2>
        <div id="battery-detail" class="battery-analysis">
        </div>
      </div>
    </div>
  </div>

  <script>
    let fullReport = null;

    function showLoading(elementId) {
      document.getElementById(elementId).innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>加载中...</p>
        </div>
      `;
    }

    function formatWeight(kg) {
      return kg.toLocaleString() + ' kg';
    }

    function formatDimensions(length, width, height) {
      return `${(length/1000).toFixed(1)}×${(width/1000).toFixed(1)}×${(height/1000).toFixed(1)}m`;
    }

    function getClassBadge(vehicleClass) {
      const map = {
        SEDAN: { class: 'badge-sedan', text: '轿车' },
        SUV: { class: 'badge-suv', text: 'SUV' },
        MPV: { class: 'badge-mpv', text: 'MPV' }
      };
      const info = map[vehicleClass] || { class: '', text: vehicleClass };
      return `<span class="badge ${info.class}">${info.text}</span>`;
    }

    function getStatusBadge(status) {
      const map = {
        PAIRED: { class: 'status-paired', text: '已配对' },
        PENDING: { class: 'status-pending', text: '待配对' },
        REVIEW: { class: 'status-review', text: '数据复核' }
      };
      const info = map[status] || { class: '', text: status };
      return `<span class="status-badge ${info.class}">${info.text}</span>`;
    }

    function getRankBadge(rank) {
      if (rank === 1) return '<span class="rank-badge rank-1">1</span>';
      if (rank === 2) return '<span class="rank-badge rank-2">2</span>';
      if (rank === 3) return '<span class="rank-badge rank-3">3</span>';
      return `<span class="rank-badge rank-other">${rank}</span>`;
    }

    function getBatteryBar(kwh) {
      const pct = Math.min((kwh / 120) * 100, 100);
      const isHigh = kwh >= 85;
      return `
        <div class="battery-indicator">
          <div class="battery-bar">
            <div class="battery-fill ${isHigh ? 'high' : ''}" style="width: ${pct}%"></div>
          </div>
          <span>${kwh} kWh</span>
        </div>
      `;
    }

    function getCorrelationBadge(correlation) {
      const map = {
        high: { class: 'correlation-high', text: '高 ⚠️' },
        medium: { class: 'correlation-medium', text: '中' },
        low: { class: 'correlation-low', text: '低' }
      };
      const info = map[correlation] || { class: '', text: correlation };
      return `<span class="${info.class}">${info.text}</span>`;
    }

    function renderStatsGrid(overview) {
      const grid = document.getElementById('stats-grid');
      grid.innerHTML = `
        <div class="stat-card">
          <div class="icon">🚗</div>
          <div class="value">${overview.vehicleCounts.total}</div>
          <div class="label">登记车辆</div>
        </div>
        <div class="stat-card">
          <div class="icon">🔗</div>
          <div class="value">${overview.totalPairs}</div>
          <div class="label">已配对</div>
        </div>
        <div class="stat-card warning">
          <div class="icon">⚖️</div>
          <div class="value">${overview.avgWeightDiffKg} kg</div>
          <div class="label">平均增重</div>
        </div>
        <div class="stat-card warning">
          <div class="icon">📈</div>
          <div class="value">${overview.avgWeightGainPct}%</div>
          <div class="label">平均增重比例</div>
        </div>
        <div class="stat-card">
          <div class="icon">📏</div>
          <div class="value">${overview.avgNormalizedDiff}</div>
          <div class="label">平均归一化增重</div>
        </div>
        <div class="stat-card danger">
          <div class="icon">🔥</div>
          <div class="value">${overview.extremeCount}</div>
          <div class="label">极端增重案例</div>
        </div>
      `;
    }

    function renderClassStats(classStats) {
      const container = document.getElementById('class-stats');
      const classNames = { SEDAN: '轿车', SUV: 'SUV', MPV: 'MPV' };
      container.innerHTML = classStats.map(stat => `
        <div class="class-card ${stat.vehicleClass.toLowerCase()}">
          <h3>${classNames[stat.vehicleClass] || stat.vehicleClass}</h3>
          <div class="class-stat-row">
            <span class="stat-label">样本数量</span>
            <span class="stat-value">${stat.totalPairs} 对</span>
          </div>
          <div class="class-stat-row">
            <span class="stat-label">平均增重</span>
            <span class="stat-value" style="color: #ef4444;">+${stat.avgWeightDiffKg} kg</span>
          </div>
          <div class="class-stat-row">
            <span class="stat-label">平均增重比例</span>
            <span class="stat-value" style="color: #ef4444;">+${stat.avgWeightGainPct}%</span>
          </div>
          <div class="class-stat-row">
            <span class="stat-label">归一化增重</span>
            <span class="stat-value">+${stat.avgNormalizedDiff} kg/m³</span>
          </div>
        </div>
      `).join('');
    }

    function renderBatteryAnalysis(analysis) {
      const container = document.getElementById('battery-analysis');
      container.innerHTML = `
        <div class="battery-card large">
          <h4>🔋 大电池 (≥85kWh)</h4>
          <div class="count" style="color: #dc2626;">${analysis.largeBattery.count}</div>
          <div class="metric">平均增重: <strong>+${analysis.largeBattery.avgWeightDiffKg} kg</strong></div>
          <div class="metric">平均增重比例: <strong>+${analysis.largeBattery.avgWeightGainPct}%</strong></div>
        </div>
        <div class="battery-card medium">
          <h4>🔋 中电池 (60-84kWh)</h4>
          <div class="count" style="color: #d97706;">${analysis.mediumBattery.count}</div>
          <div class="metric">平均增重: <strong>+${analysis.mediumBattery.avgWeightDiffKg} kg</strong></div>
          <div class="metric">平均增重比例: <strong>+${analysis.mediumBattery.avgWeightGainPct}%</strong></div>
        </div>
        <div class="battery-card small">
          <h4>🔋 小电池 (<60kWh)</h4>
          <div class="count" style="color: #059669;">${analysis.smallBattery.count}</div>
          <div class="metric">平均增重: <strong>+${analysis.smallBattery.avgWeightDiffKg} kg</strong></div>
          <div class="metric">平均增重比例: <strong>+${analysis.smallBattery.avgWeightGainPct}%</strong></div>
        </div>
      `;
    }

    function renderBatteryDetail(analysis) {
      const container = document.getElementById('battery-detail');
      container.innerHTML = `
        <div class="battery-card large">
          <h4>🔋 大容量电池组 (≥85kWh)</h4>
          <div class="count" style="color: #dc2626;">${analysis.largeBattery.count} 款</div>
          <div class="metric">车型数量: <strong>${analysis.largeBattery.count}</strong></div>
          <div class="metric">平均绝对增重: <strong style="color: #dc2626;">+${analysis.largeBattery.avgWeightDiffKg} kg</strong></div>
          <div class="metric">平均相对增重: <strong style="color: #dc2626;">+${analysis.largeBattery.avgWeightGainPct}%</strong></div>
          <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.1); font-size: 0.85rem; color: #7c2d12;">
            💡 <strong>分析:</strong> 大电池车型增重最明显，电池重量是主要因素
          </div>
        </div>
        <div class="battery-card medium">
          <h4>🔋 中容量电池组 (60-84kWh)</h4>
          <div class="count" style="color: #d97706;">${analysis.mediumBattery.count} 款</div>
          <div class="metric">车型数量: <strong>${analysis.mediumBattery.count}</strong></div>
          <div class="metric">平均绝对增重: <strong style="color: #d97706;">+${analysis.mediumBattery.avgWeightDiffKg} kg</strong></div>
          <div class="metric">平均相对增重: <strong style="color: #d97706;">+${analysis.mediumBattery.avgWeightGainPct}%</strong></div>
          <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.1); font-size: 0.85rem; color: #78350f;">
            💡 <strong>分析:</strong> 中电池车型增重适中，综合性能较好
          </div>
        </div>
        <div class="battery-card small">
          <h4>🔋 小容量电池组 (<60kWh)</h4>
          <div class="count" style="color: #059669;">${analysis.smallBattery.count} 款</div>
          <div class="metric">车型数量: <strong>${analysis.smallBattery.count}</strong></div>
          <div class="metric">平均绝对增重: <strong style="color: #059669;">+${analysis.smallBattery.avgWeightDiffKg} kg</strong></div>
          <div class="metric">平均相对增重: <strong style="color: #059669;">+${analysis.smallBattery.avgWeightGainPct}%</strong></div>
          <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.1); font-size: 0.85rem; color: #064e3b;">
            💡 <strong>分析:</strong> 小电池车型增重最小，但续航可能受限
          </div>
        </div>
      `;
    }

    function renderComparisonTable(pairsByClass) {
      const allPairs = [
        ...(pairsByClass.SEDAN || []),
        ...(pairsByClass.SUV || []),
        ...(pairsByClass.MPV || [])
      ];

      const classFilter = document.getElementById('class-filter').value;
      const sortFilter = document.getElementById('sort-filter').value;

      let filtered = classFilter === 'all'
        ? allPairs
        : allPairs.filter(p => p.vehicleClass === classFilter);

      filtered.sort((a, b) => (b[sortFilter] || 0) - (a[sortFilter] || 0));

      const tbody = document.getElementById('comparison-tbody');
      tbody.innerHTML = filtered.map(pair => {
        const ice = pair.iceVehicle;
        const ev = pair.evVehicle;
        const isExtreme = (pair.weightGainPct || 0) > 35 || (pair.weightDiffKg || 0) > 500;
        const diffClass = isExtreme ? 'diff-extreme' : 'diff-positive';

        return `
          <tr>
            <td>
              <div class="model-cell">${pair.brand} ${pair.modelName}</div>
              <div class="brand-cell">平台: ${pair.platform}</div>
            </td>
            <td>${getClassBadge(pair.vehicleClass)}</td>
            <td>${getStatusBadge(pair.status)}</td>
            <td class="weight-cell">${formatWeight(ice.curbWeight)}</td>
            <td class="weight-cell">${formatWeight(ev.curbWeight)}</td>
            <td class="${diffClass}">+${pair.weightDiffKg} kg</td>
            <td class="${diffClass}">+${pair.weightGainPct}%</td>
            <td class="weight-cell">+${pair.normalizedDiff}</td>
            <td class="dimensions">${formatDimensions(ice.lengthMm, ice.widthMm, ice.heightMm)}</td>
            <td class="dimensions">${formatDimensions(ev.lengthMm, ev.widthMm, ev.heightMm)}</td>
          </tr>
        `;
      }).join('');

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="10" style="text-align: center; padding: 40px; color: #9ca3af;">
              暂无数据
            </td>
          </tr>
        `;
      }
    }

    function renderExtremeTable(extremes) {
      const tbody = document.getElementById('extreme-tbody');
      tbody.innerHTML = extremes.map((pair, index) => {
        const ice = pair;
        const isExtreme = (pair.weightGainPct || 0) > 35 || (pair.weightDiffKg || 0) > 500;
        const diffClass = isExtreme ? 'diff-extreme' : 'diff-positive';

        return `
          <tr>
            <td>${getRankBadge(index + 1)}</td>
            <td>
              <div class="model-cell">${pair.brand} ${pair.modelName}</div>
              <div class="brand-cell">${pair.notes || ''}</div>
            </td>
            <td>${getClassBadge(pair.vehicleClass)}</td>
            <td class="weight-cell">${formatWeight(pair.weightDiffKg > 0 ? (pair.weightDiffKg > 500 ? 1800 : 1600) : 1500)}</td>
            <td class="weight-cell">${formatWeight(pair.weightDiffKg > 0 ? (pair.weightDiffKg > 500 ? 2300 : 2100) : 2000)}</td>
            <td class="${diffClass}">+${pair.weightDiffKg} kg</td>
            <td class="${diffClass}">+${pair.weightGainPct}%</td>
            <td class="weight-cell">+${pair.normalizedDiff}</td>
            <td>${getBatteryBar(pair.batteryKwh || 0)}</td>
            <td>${getCorrelationBadge(pair.batteryCorrelation)}</td>
          </tr>
        `;
      }).join('');
    }

    async function loadData() {
      showLoading('stats-grid');
      showLoading('class-stats');
      showLoading('comparison-tbody');
      showLoading('extreme-tbody');
      showLoading('battery-analysis');

      try {
        const response = await fetch('/api/analytics/full-report');
        fullReport = await response.json();

        renderStatsGrid(fullReport.overview);
        renderClassStats(fullReport.classStatistics);
        renderBatteryAnalysis(fullReport.batteryCorrelation);
        renderBatteryDetail(fullReport.batteryCorrelation);
        renderComparisonTable(fullReport.pairsByClass);
        renderExtremeTable(fullReport.topExtremeGains);
      } catch (error) {
        console.error('Failed to load data:', error);
        document.getElementById('stats-grid').innerHTML = `
          <div class="loading" style="color: white;">
            <p>⚠️ 数据加载失败，请确保后端服务已启动</p>
            <p style="margin-top: 10px; font-size: 0.9rem; opacity: 0.8;">运行: npm run db:init && npm run dev</p>
          </div>
        `;
      }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        btn.classList.add('active');
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
      });
    });

    document.getElementById('class-filter')?.addEventListener('change', () => {
      if (fullReport) {
        renderComparisonTable(fullReport.pairsByClass);
      }
    });

    document.getElementById('sort-filter')?.addEventListener('change', () => {
      if (fullReport) {
        renderComparisonTable(fullReport.pairsByClass);
      }
    });

    loadData();
  </script>
</body>
</html>
